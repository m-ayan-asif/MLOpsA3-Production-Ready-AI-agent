[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "0.1.0"
description = "Production-style MLOps AI agent over DVC, MLflow, Airflow 3 and Kubernetes"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "requests>=2.31",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "google-genai>=1.20",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Runtime integrations. Imported lazily, so CI/unit tests do not need them.
mlops = [
  "mlflow>=3.0",
  "dvc>=3.50",
  "kubernetes>=29",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "joblib>=1.3",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom
